<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MethodAtlas · 本地研究工作台</title>
<link rel="stylesheet" href="report.css" id="report-theme">
<link rel="icon" href="data:,">
<style>
:root{
  /* DesignMD: white surfaces, cool-grey chrome, blue actions. Green is semantic only. */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
  --bg:#F5F7FB;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --surface-3:#EDF3FF;
  --line:#EEEEF0;
  --line-soft:#EEEEF0;
  --control-line:#8B95A5;
  --field:#FFFFFF;
  --ink:#182230;
  --muted:#667085;
  --faint:#667085;
  --disabled:#98A2B3;
  --blue:#246BDB;
  --green:#26844F;
  --purple:#6F42A6;
  --danger:#BE321E;
  --accent:#246BDB;
  --accent-soft:#EDF3FF;
  --hover:#E7EDF5;
  --hover-selected:#DCE7FA;
  --accent-hover:#1E5FC5;
  --accent-active:#194FA6;
  --preview:#E4E4E6;
  --pill-ink:#FFFFFF;
  --radius-sm:0.375rem;
  --radius:0.375rem;
  --radius-lg:0.625rem;
  --radius-xl:1rem;
  --panel-head-height:2.75rem;
  --ease:ease-out;
  --shadow-1:0 1px 0.25rem rgb(24 34 48 / 4%);
  --shadow-2:0 0.5rem 2rem rgb(24 34 48 / 10%),0 1px 0.25rem rgb(24 34 48 / 4%);
}
:root{color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;font-size:0.9375rem;background:var(--bg);cursor:default}
button,input,textarea,select{font:inherit;color:inherit}
/* Reading text is not editing: the text cursor belongs to real text fields, not to every heading, label and paragraph. */
input,textarea,[contenteditable]:not([contenteditable="false"]){cursor:text}
button{cursor:pointer}
button:disabled{cursor:default;color:var(--disabled);opacity:.65}
/* Read-only interface text (status lines, labels, progress, hints, counters) neither selects nor
   carries a text caret, so the insertion point can only ever land in a real text field. This also
   covers the browser's caret-browsing navigation caret, which caret-color cannot hide. Content —
   answers, artifact bodies, citation titles and every field — stays selectable. */
button,summary,label,.badge,.chip,.panel-head,.agent-name,.task-status,.task-wait,.task-hint,
.execution-record,.research-plan,.step-details,.other-actions,.current-action,.plan-title,
.studio-note,.output-tools,.version-picker,.collection-head,.toolbar-left,.search-field,
.reading-history>summary,.artifact-sources>summary,.welcome-ask{user-select:none;-webkit-user-select:none}
.answer-text,.artifact-title,.output-detail,.preview-paper,pre,.summary-text,
input,textarea,select,[contenteditable]:not([contenteditable="false"]){user-select:text;-webkit-user-select:text}
input,textarea,select{border:1px solid var(--control-line);border-radius:var(--radius);padding:0.5rem 0.625rem;background:var(--field)}

input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}
input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--accent);cursor:pointer;margin:0;flex-shrink:0}
a{color:var(--accent);text-decoration:none}
a[href]:hover{color:var(--accent-hover);background:var(--hover)}
h1,h2,h3,p{margin:0}
h1{font-size:1.625rem;font-weight:500;letter-spacing:-.3px}
h2{font-size:1.0625rem;font-weight:500}
h3{font-size:0.9375rem;font-weight:500}
small,.muted{color:var(--muted)}
small{font-size:0.875rem;line-height:1.7}
svg{width:1.1875rem;height:1.1875rem;flex-shrink:0;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon{width:2.25rem;height:2.25rem;padding:0.5rem;border:0;border-radius:50%;background:transparent;box-shadow:none}
.icon:hover:not(:disabled){background:var(--hover)}
/* Download links are written as icons too, so they need the same box the icon buttons get. */
a.icon{display:inline-grid;place-items:center;color:var(--muted);text-decoration:none}
a.icon:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.dialog-status a{display:inline-flex;align-items:center;gap:0.3125rem}
.dialog-status a svg{width:0.9375rem;height:0.9375rem;color:var(--muted)}

button.primary{background:var(--accent);color:var(--pill-ink);border:1px solid var(--accent);border-radius:var(--radius-sm);box-shadow:none}
button.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:var(--pill-ink);box-shadow:none}
button.primary:active:not(:disabled){transform:none;background:var(--accent-active);border-color:var(--accent-active)}
.pill{border-radius:var(--radius-xl)}
button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:0.375rem 0.75rem;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;box-shadow:none;transition:background 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease),box-shadow 160ms var(--ease)}
button:hover:not(:disabled){background:var(--hover);border-color:var(--line);box-shadow:none}
button:active:not(:disabled){transform:none}
.badge{display:inline-flex;align-items:center;gap:0.3125rem;font-size:0.84375rem;border:0;background:var(--surface-2);color:var(--muted);padding:0.1875rem 0.5625rem;border-radius:var(--radius-sm);white-space:nowrap}
.row{display:flex;align-items:center;gap:0.625rem}
.between{justify-content:space-between}
.hidden,[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:0.625rem;font-size:1.1875rem;font-weight:600;letter-spacing:-.4px}
.brandmark{width:1.875rem;height:1.625rem;flex:none;display:grid;place-items:center}
.brandmark img{display:block;width:100%;height:100%;object-fit:contain}
.avatar{width:2.125rem;height:2.125rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);border:1px solid var(--line-soft);color:var(--accent);font-size:0.875rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.workspace{height:100dvh;min-height:30rem;display:flex;flex-direction:column}
.workspace .app-header{background:var(--surface);border-bottom:1px solid var(--line-soft);height:2.75rem;padding:0 1rem;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:0.75rem}
.project-title{font-size:1rem;font-weight:500;max-width:38vw;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.panels{display:grid;grid-template-columns:minmax(11.25rem,var(--source-width,.95fr)) 0.625rem minmax(17.5rem,var(--chat-width,1.8fr)) 0.625rem minmax(13.75rem,var(--studio-width,1.1fr));transition:grid-template-columns 180ms var(--ease);gap:0;padding:0;flex:1;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;box-shadow:none}
.panel-resizer{cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);outline-offset:-2px}
.panel-resizer::after{content:"";align-self:stretch;width:1px;height:100%;background:var(--line-soft);transition:background 160ms var(--ease),width 160ms var(--ease)}
.panel-resizer:hover::after,.panel-resizer:focus-visible::after{background:var(--blue);width:0.1875rem}
.resizing-panels{cursor:col-resize;user-select:none}.resizing-panels iframe{pointer-events:none}.resizing-panels .panels{transition:none}
.panel{position:relative;background:transparent;border:0;border-radius:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.panel-head{height:var(--panel-head-height);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding:0 0.75rem 0 1.125rem;flex-shrink:0;gap:0.5rem}
/* 栏头使用统一高度，装不下两行标题：标题始终一行，放不下就省略号；右侧工具（版本下拉、收起按钮）
   不参与收缩，标题左侧的返回箭头同理。 */
.panel-head>:last-child{flex:none}
.panel-head>.row{min-width:0}
.panel-head h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}
.panel-head .panel-title{display:flex;align-items:center;gap:0.5rem;min-width:0;flex:1}
.panel-title .badge{flex:none;font-size:0.75rem;padding:2px 0.5rem}
.panel-title .badge:empty{display:none}
.workspace-content{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.panel-tabs,.panel-rail{display:none}
.panel-toggle{flex:none}
#sources-panel .panel-toggle svg{transform:scaleX(-1)}
.panels.sources-collapsed{grid-template-columns:minmax(3rem,0fr) 0.625rem minmax(17.5rem,var(--chat-width,1.8fr)) 0.625rem minmax(13.75rem,var(--studio-width,1.1fr))}
.panels.output-collapsed{grid-template-columns:minmax(11.25rem,var(--source-width,.95fr)) 0.625rem minmax(17.5rem,var(--chat-width,1.8fr)) 0.625rem minmax(3rem,0fr)}
.panels.sources-collapsed.output-collapsed{grid-template-columns:minmax(3rem,0fr) 0.625rem minmax(17.5rem,1fr) 0.625rem minmax(3rem,0fr)}
.panel-resizer[inert]{visibility:hidden}
.panel-collapsed>:not(.panel-head,.panel-rail),.panel-collapsed>.panel-head>:not(.panel-toggle){display:none!important}
.panel-collapsed>.panel-head{justify-content:center;padding:0}
.panel-collapsed>.panel-rail{display:flex;flex-direction:column;align-items:center;gap:0.25rem;overflow:auto;padding:0.5rem 0;min-height:0}
.panel-rail .icon{width:2.5rem;height:2.5rem;flex:none}
.panel-body{padding:1rem;overflow:auto;min-height:0;flex:1}
.workspace-foot{height:1.875rem;display:grid;place-items:center;font-size:0.84375rem;color:var(--faint);flex-shrink:0}
/* Shell: one global navigation rail carries every workspace view; the panel grid stays the content area. */
.shell{flex:1;min-height:0;display:flex;align-items:stretch;gap:0;padding:0 0.5rem 0 0}
/* The app nav is an icon rail: the label sits under the icon so the column stays narrow. */
.shell-nav{position:relative;width:4rem;background:#F6F9FB;flex:none;display:flex;flex-direction:column;gap:1px;padding:0.25rem 0.25rem 0.75rem;overflow:auto}
.shell-nav button{width:100%;flex-direction:column;align-items:center;justify-content:center;gap:0.3125rem;padding:0.5625rem 2px;border:0;border-radius:var(--radius-xl);background:transparent;box-shadow:none;color:var(--muted);font-size:0.75rem;line-height:1.35;text-align:center}
.shell-nav button svg{width:1.25rem;height:1.25rem;color:var(--faint)}
.shell-nav button:hover:not(:disabled){background:var(--hover);color:var(--ink);transform:none;box-shadow:none}
.shell-nav button:hover:not(:disabled) svg{color:var(--ink)}
.shell-nav button.active{position:relative;color:var(--accent);font-weight:500}
.shell-nav-indicator{position:absolute;left:0.25rem;top:0;width:0.1875rem;height:1px;border-radius:0.1875rem;background:var(--accent);pointer-events:none;transform-origin:top left}
.shell-nav button.active svg{color:var(--accent)}
.shell-sep{height:1px;margin:0.5rem 0.625rem;background:var(--line-soft);flex:none}
/* Research-day view: the day timeline, that day's sections as cards, then the editable body. */
.day-list{display:flex;flex-direction:column;gap:1px}
.day-row{display:flex;flex-direction:column;gap:0.3125rem;width:100%;padding:0.625rem 0.75rem;border:0;border-radius:var(--radius);background:transparent;box-shadow:none;text-align:left;align-items:stretch}
.day-row:hover:not(:disabled){background:var(--hover);transform:none;box-shadow:none}
.day-row.active{background:var(--accent-soft)}
.day-row-head{display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;font-weight:500;color:var(--ink)}
.day-dot{width:0.4375rem;height:0.4375rem;border-radius:50%;background:var(--line);flex:none}
.day-row.active .day-dot{background:var(--accent)}
.day-row-sum{font-size:0.875rem;line-height:1.6;color:var(--muted)}
.memory-list{display:flex;flex-direction:column;gap:0.625rem}
.memory-card{border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;flex:none}
.memory-head{display:flex;align-items:center;gap:0.5rem;padding:0.6875rem 0.875rem;border-bottom:1px solid var(--line-soft);font-size:0.875rem;font-weight:500}
.memory-head svg{width:1rem;height:1rem;color:var(--accent)}
.memory-head .badge{margin-left:auto}
.memory-items{display:flex;flex-direction:column;gap:0.4375rem;margin:0;padding:0.75rem 0.875rem;font-size:0.84375rem;line-height:1.7;list-style:none}
.memory-items li{position:relative;padding-left:0.875rem}
.memory-items li::before{content:"";position:absolute;left:2px;top:0.5625rem;width:0.25rem;height:0.25rem;border-radius:50%;background:var(--muted)}
.memory-column{flex:1;min-height:0;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:0.75rem}
/* 工作台用 `#chat-body{overflow:hidden}` 把输入框钉在底部，而 id 压得过上面这个类——于是所有栏式视图
   的中栏（本日记录、论文订阅、远程实验、文献库阅读器、笔记）都被裁掉了下半截，且滚不动。
   在定义栏本身的地方把滚动要回来，不去追那条 id 规则。 */
#chat-body.memory-column{overflow:auto}
.memory-settings,.memory-record{display:flex;flex-direction:column;gap:0.75rem;border-top:1px solid var(--line-soft);padding-top:0.75rem}
/* Panels are not dialogs: the dialog's spacing rules assumed a dialog, so the rhythm is restated here
   (flex gap between siblings) and the old margins are zeroed to stop the two stacking. */
.memory-column>.dialog-field,.memory-column>.dialog-check,.memory-column>.row,
.memory-editor .dialog-field,.memory-editor .row,.memory-proposal-body .row,
.memory-settings .dialog-check,.memory-record .dialog-field{margin-top:0}
.memory-column form:is([data-server-form],[data-experiment-form],[data-result-form]){display:flex;flex-direction:column;gap:1rem}
.memory-column form:is([data-server-form],[data-experiment-form],[data-result-form]) :is(.dialog-field,.dialog-actions,.dialog-row,.row){margin-top:0}
.memory-settings>summary,.memory-record>summary{display:flex;align-items:center;gap:0.375rem;font-size:0.875rem;color:var(--muted);cursor:pointer;list-style:none}
.memory-settings>summary::-webkit-details-marker,.memory-record>summary::-webkit-details-marker{display:none}
.memory-settings>summary::before,.memory-record>summary::before{content:"";flex:none;width:0;height:0;border-left:0.3125rem solid currentColor;border-top:0.28125rem solid transparent;border-bottom:0.28125rem solid transparent;transform-origin:32% 50%;transition:transform 180ms var(--ease)}
.memory-settings[open]>summary::before,.memory-record[open]>summary::before{transform:rotate(90deg)}
.memory-record textarea{min-height:4.75rem}
.memory-editor{display:flex;flex-direction:column;gap:0.75rem;flex:1;min-height:0}
/* In the day view the editor sits above the record rather than filling the column, so it must not stretch
   and its textarea needs its own scroll box. */
#chat-body>.memory-editor{flex:none}
#chat-body>.memory-editor .memory-text{min-height:11.25rem;max-height:20rem;overflow:auto;resize:vertical}
.memory-editor-top{align-items:flex-end}
.memory-editor-top .dialog-field{flex:1;min-width:0}
.memory-text{flex:1;min-height:15rem;resize:none;font-size:0.84375rem;line-height:1.75}
.memory-editor-actions{flex-wrap:wrap}
.memory-proposal-body{display:flex;flex-direction:column;gap:0.5rem;padding:0.75rem 0.875rem}
.memory-proposal-body h4{font-size:0.875rem;font-weight:500;color:var(--muted)}
.library-list{display:flex;flex-direction:column;gap:2px}
.library-row{display:flex;align-items:flex-start;gap:0.5625rem;width:100%;padding:0.5625rem 0.625rem;border:0;border-radius:var(--radius);background:transparent;box-shadow:none;color:var(--ink);text-align:left}
/* These are list rows, not buttons with a centred label: their content starts at the left edge.
   Without this they inherit the global button centring and drift once a title is short. */
.library-row,.day-row,.output-tile,.file-card,.paper-link,.history-item{justify-content:flex-start}

.chat-search{display:flex;align-items:center;gap:0.5rem;min-height:2.25rem;padding:0 0.625rem;border:1px solid var(--line);border-radius:var(--radius);background:transparent;color:var(--faint)}
.chat-search svg{flex:none;width:0.9375rem;height:0.9375rem}
.chat-search input{flex:1;min-width:0;border:0;background:none;padding:0;font-size:0.875rem;color:var(--ink)}
.chat-new{width:100%;margin-top:0.625rem}
.conversation-list{display:flex;flex-direction:column;gap:0.25rem;margin-top:0.75rem}

.conversation-row{display:flex;align-items:center;justify-content:flex-start;gap:0.5rem;width:100%;height:2.25rem;padding:0.375rem 0.625rem;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:none;color:var(--ink);text-align:left;transition:transform 170ms var(--ease),border-color 170ms,box-shadow 170ms var(--ease)}
/* Compact single-line conversations; the right slot is reserved for activity or unread replies. */
.conversation-icon{flex:none;display:grid;place-items:center;width:1rem;height:1rem;padding:0;border-radius:var(--radius);background:transparent;color:var(--faint);box-shadow:none}
.conversation-icon svg{width:100%;height:100%}
.conversation-body{min-width:0;flex:1}
.conversation-body strong{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.03125rem;font-weight:700;line-height:1.5}
.conversation-row:hover:not(:disabled){transform:none;background:var(--hover);box-shadow:none}
.conversation-row.active{background:var(--accent-soft);border-color:var(--accent-soft);box-shadow:none}
.conversation-row.active .conversation-icon{color:var(--accent)}
.library-row svg{flex:none;width:1rem;height:1rem;margin-top:2px;color:var(--faint)}
/* 远程实验：左栏上下两块（服务器 / 最近任务），中栏是任务详情。 */
.rail{display:flex;flex-direction:column;gap:0.875rem;height:100%;min-height:0}
.remote-rail{height:auto;min-height:100%}
.remote-rail>.rail-block{flex-shrink:0}
.rail-block{display:flex;flex-direction:column;gap:0.5rem;min-height:0}
.rail-block.grow{flex:1}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.rail-head h3{font-size:1.03125rem;font-weight:700}
.rail-actions{margin-top:auto}
.rail-actions button{width:100%;justify-content:center}
.rail-empty{padding:2rem 0.25rem;text-align:center}
.mini{font-size:0.8125rem;padding:0.3125rem 0.5625rem;gap:0.3125rem}
.mini svg{width:0.875rem;height:0.875rem}
/* Rail controls are the subscription filter chips: same padding, radius and size, so the two left-column
   panels offer their actions the same way. The create action carries the accent, the rest stay quiet. */
.rail .mini{border:0;border-radius:var(--radius-sm);padding:0.375rem 0.625rem;font-size:0.875rem;background:var(--surface-2);color:var(--muted);box-shadow:none}
.rail .mini svg{width:0.875rem;height:0.875rem}
.rail .mini:hover:not(:disabled){background:var(--hover);color:var(--ink);transform:none;box-shadow:none}
.rail .mini[data-add-server]{background:var(--accent-soft);color:var(--accent)}
.rail .mini[data-add-server]:hover:not(:disabled){background:var(--hover);color:var(--accent-hover);transform:none;box-shadow:none}
.server-list{display:flex;flex-direction:column;gap:0.5rem}
/* Server entries are the subscription card: a 1.875rem lamp slot, the name, then one meta line. */
.server-row{display:flex;align-items:flex-start;gap:0.625rem;padding:0.625rem 0.625rem;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:none;overflow:hidden;transition:transform 170ms var(--ease),border-color 170ms,box-shadow 170ms var(--ease)}
.server-row:hover{background:var(--hover);transform:none;box-shadow:none}
.server-row.active{background:var(--accent-soft);border-color:var(--accent-soft);box-shadow:none}
.server-pick{display:flex;align-items:flex-start;justify-content:flex-start;gap:0.625rem;flex:1;min-width:0;padding:2px 0;border:0;background:transparent;box-shadow:none;color:var(--ink);text-align:left}
.server-pick:hover:not(:disabled){background:var(--hover);transform:none;box-shadow:none}
/* The lamp is the subscription dot: 0.5625rem centred in a 1.875rem slot, flat, no halo. */
.server-dot{flex:none;display:grid;place-items:center;width:1.875rem;height:1.875rem;border-radius:var(--radius);color:var(--line)}
.server-dot::before{content:"";width:0.5625rem;height:0.5625rem;border-radius:50%;background:currentColor}
.server-dot[data-state=online]{color:var(--green)}
.server-dot[data-state=offline]{color:var(--danger)}
.server-body{display:flex;flex-direction:column;gap:0.1875rem;min-width:0}

.server-body strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.1875rem;font-weight:700;line-height:1.45}
.server-body small{font-size:0.9375rem;line-height:1.6;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.server-count{flex:none;min-width:1.375rem;height:1.375rem;padding:0 0.4375rem;display:inline-flex;align-items:center;justify-content:center;border-radius:62.4375rem;background:rgb(32 33 36/.06);color:var(--muted);font-size:0.8125rem;font-weight:600;font-variant-numeric:tabular-nums}
.server-row.active .server-count{background:var(--accent-soft);color:var(--accent)}
.server-more{flex:none;width:1.75rem;height:1.75rem;padding:0.1875rem;margin:1px -0.1875rem 0 0;opacity:0;transition:opacity .15s}
.server-row:hover .server-more,.server-more:focus-visible{opacity:1}
.task-detail{display:flex;flex-direction:column;gap:0.8125rem}
.task-detail h4{margin-top:0.25rem;font-size:0.875rem;color:var(--muted)}

.library-list.cards{gap:0.5rem}
.library-row.card{padding:0.625rem 0.625rem;gap:0.5rem;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:none;transition:transform 170ms var(--ease),border-color 170ms,box-shadow 170ms var(--ease)}
.library-row.card:hover:not(:disabled){transform:none;background:var(--hover);box-shadow:none}

   列表行高因此整齐，扫读时不用重新找基线。 */
.library-row.card .library-row-body{gap:0.1875rem;min-width:0}
.library-row.card .library-row-body strong{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.03125rem;font-weight:700;line-height:1.5}

.library-row.card .sub-dot{flex:none;display:grid;place-items:center;width:1.875rem;height:1.875rem;margin:0;border-radius:var(--radius);background:none;box-shadow:none;color:var(--line)}

   摘要常有两三行，字号比来源卡片的「15 页」大一档，长段落读起来才不费劲。 */
.day-list.cards{gap:0.5rem}

.candidate-row{display:flex;align-items:center;gap:0.625rem;min-width:0}
.candidate-title{display:block;flex:1;min-width:0;padding:0.375rem 0.5625rem;border:1px solid var(--line-soft);border-radius:var(--radius);background:transparent;color:var(--ink);font-size:0.875rem;line-height:1.25rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.candidate-title:hover{color:var(--accent-hover)}
.candidate-row button,.collect-all{flex:none;padding:0.3125rem 0.625rem;min-height:2rem;border:1px solid var(--line);border-radius:var(--radius-xl);background:transparent;box-shadow:none;font-size:0.875rem;color:var(--accent)}
.candidate-reason{margin:0.375rem 0 0;font-size:0.875rem;color:var(--muted);line-height:1.65;overflow-wrap:anywhere}
.collect-all{margin-top:1rem}
/* Readability tweaks, without changing the existing reader/editor layouts. */
.paper-link,.chip,.welcome-ask,.message.user,.message.agent,.answer-text,.composer textarea{font-size:0.9375rem}
.paper-meta,.source-count,.composer-bottom small,.badge{font-size:0.875rem}
.summary-text,.empty-small,.studio-note,.output-section-title,.artifact-download,.version-picker select{font-size:0.875rem}
.output-tile{font-size:0.875rem}
.execution-record>summary,.plan-title,.task-wait{font-size:0.875rem}
.plan-summary,.action-list,.message details,.step-details>summary,.other-actions>summary{font-size:0.875rem;color:var(--muted)}
.execution-record{color:var(--muted)}
.evidence-link,.citation-inline{font-size:0.875rem}

/* Answering process: a calmer timeline, one icon row per tool call, link-like targets. */
.message.agent{display:flex;flex-direction:column;gap:0.5rem}
.agent-name{margin-bottom:0;font-size:0.875rem}
.execution-record{margin:0}
.execution-record>summary{display:flex;align-items:center;gap:0.4375rem;width:fit-content;list-style:none;font-size:0.875rem;color:var(--muted);padding:0;border:0;border-radius:0;background:none;line-height:1.6;cursor:pointer}
.execution-record>summary::-webkit-details-marker{display:none}
.execution-record>summary:hover{background:var(--hover);color:var(--ink)}
.execution-record[open]>summary{margin-bottom:1rem}
.research-plan{margin:0;padding:0 0 0 0.25rem}
.plan-step{gap:0.75rem;padding:0 0 1.1875rem}
.plan-step:not(:last-child)::before{left:0.3125rem;top:1.0625rem;border-left:1px solid #dee2ea}
.plan-dot{width:0.6875rem;height:0.6875rem;margin-top:0.3125rem;background:#b9c0ca;font-size:0.5rem;line-height:0.6875rem}
.plan-step[data-state=pending] .plan-dot{width:0.4375rem;height:0.4375rem;margin:0.4375rem 2px 0;background:#c3c8d0}
.plan-step[data-state=completed] .plan-dot{background:var(--green)}
.plan-step[data-state=active] .plan-dot{background:var(--blue)}
.plan-title{font-size:0.875rem;font-weight:550}
.plan-summary{margin:0.3125rem 0 0;font-size:0.875rem;line-height:1.75}
.plan-step[data-state=active] .plan-summary{color:var(--ink)}
@keyframes row-enter{from{opacity:0;transform:translateY(0.1875rem)}to{opacity:1;transform:none}}
.tool-line.enter{animation:row-enter 150ms var(--ease) backwards}
.tool-list,.tool-count{list-style:none;margin:0.5625rem 0 0;padding:0}
.tool-count{font-size:0.84375rem;color:var(--faint);margin:0.5rem 0 0}
.tool-list{display:flex;flex-direction:column;gap:0.4375rem}
.tool-line{display:flex;align-items:flex-start;gap:0.5rem;font-size:0.84375rem;line-height:1.65;color:var(--muted);min-width:0}
.tool-line svg{width:0.875rem;height:0.875rem;margin-top:2px;color:var(--faint);flex:none}
.tool-line span{min-width:0;overflow-wrap:anywhere}
.tool-target{font-weight:500;color:var(--blue);overflow-wrap:anywhere}
.tool-line[data-state=running] svg{color:var(--blue)}
.tool-line[data-state=done] svg{color:var(--green)}
.tool-line[data-state=failed]{color:var(--danger)}
.tool-line[data-state=failed] svg,.tool-line[data-state=failed] .tool-target{color:var(--danger)}
.step-details{margin-top:0.5625rem}
.task-wait{display:flex;align-items:center;font-size:0.875rem;margin:0}
.task-wait::before{width:0.4375rem;height:0.4375rem;background:var(--blue);margin:0 0.5625rem 0 0}
.answer-text{margin:0;line-height:1.95}
.answer-text strong{font-weight:600}
.citation-inline{font-size:0.875rem;color:var(--blue);background:var(--accent-soft);border-radius:var(--radius-sm);padding:1px 0.375rem}
.citation-inline:hover{color:var(--accent-hover);background:var(--hover)}
.file-list{display:flex;flex-direction:column;gap:0.5rem;align-items:flex-start}
.file-card{display:flex;align-items:center;gap:0.5625rem;max-width:100%;width:fit-content;padding:0.5625rem 0.8125rem;border-radius:var(--radius-xl);font-size:0.875rem}
.file-card svg{width:1rem;height:1rem;color:var(--blue);flex:none}
.file-card .file-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card .file-version{flex:none;font-size:0.84375rem;color:var(--muted);background:var(--surface-3);border-radius:var(--radius-sm);padding:2px 0.5rem}
.file-card:hover{background:var(--hover)}
.task-status{display:flex;align-items:center;gap:0.5625rem;flex-wrap:wrap;padding:0;border:0;border-radius:0;background:none;box-shadow:none;font-size:0.875rem;color:var(--muted)}
.task-status svg{width:1rem;height:1rem;color:var(--blue);flex:none}
.task-status .task-status-text{font-weight:500;color:var(--ink)}
.task-status .task-hint{flex-basis:100%;font-size:0.875rem;color:var(--muted);line-height:1.7}
/* Inside the status line the saved files read as plain text too, not as chips. */
.task-status .file-card{padding:0;border:0;border-radius:0;background:none;box-shadow:none}
.task-status .file-card:hover{background:var(--hover);color:var(--accent-hover)}
.task-status .file-card .file-version{padding:0;background:none;border-radius:0}
.task-error{background:none;border:0;color:var(--danger)}
.task-error svg,.task-error .task-status-text{color:var(--danger)}


/* Compact application chrome; reading and manuscript typography remain content-owned. */
body{font-size:0.875rem}
h1{font-size:1.5rem}h2{font-size:1rem}h3{font-size:0.875rem}small{font-size:0.75rem}
.brand{font-size:1.0625rem}.project-title,.panel-head h2{font-size:0.875rem;font-weight:600}
.paper-link,.conversation-body strong,.library-row.card .library-row-body strong,
.rail .library-row-body strong,.day-row.card .day-row-head,.server-body strong{font-size:0.875rem;font-weight:500}
.paper-meta,.library-row.card .library-row-body small,
.rail .library-row-body small,.day-row.card .day-row-sum,.server-body small,.badge{font-size:0.75rem}
.welcome h1{font-size:1.25rem;font-weight:600}.welcome-ask{font-size:0.875rem}
.chip,.output-tile,.composer textarea{font-size:0.875rem}
.message.user,.message.agent,.answer-text{font-size:0.9375rem;line-height:1.8}
.composer-bottom small{font-size:0.75rem}.artifact-title{font-size:1rem}
.modal-head h2,.dialog-head h2{font-size:1.125rem;font-weight:600}

.composer:focus-within{border-color:var(--accent);background:var(--surface)}
.panel-resizer:focus-visible::after{background:var(--accent);width:0.1875rem}
::selection{background:var(--surface-3);color:var(--ink)}
/* Queued messages wait above the composer: drag or use the row actions to reorder, edit or drop them. */
.queue-panel{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.875rem}
.queue-head{display:flex;align-items:baseline;justify-content:space-between;gap:0.625rem;padding:0 0.25rem}
.queue-head span{font-size:0.875rem;font-weight:550;color:var(--muted)}
.queue-head small{font-size:0.84375rem;color:var(--faint)}
.queue-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.5rem;max-height:34vh;overflow:auto}
.queue-item{display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.75rem;border:1px solid var(--line-soft);border-radius:var(--radius-xl);background:var(--surface-2);box-shadow:none;transition:border-color 160ms var(--ease),background 160ms var(--ease)}
.queue-item.dragging{opacity:.5}
.queue-item.drop-before{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.queue-handle{display:flex;flex:none;color:var(--faint);cursor:grab}
.queue-handle svg{width:0.9375rem;height:0.9375rem}
.queue-text{flex:1;min-width:0;font-size:0.9375rem;line-height:1.6;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.queue-actions{display:flex;flex:none;align-items:center;gap:0.25rem}
.queue-actions button{width:1.875rem;height:1.875rem;padding:0.375rem;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--muted);box-shadow:none}
.queue-actions button:hover:not(:disabled){background:var(--hover);color:var(--ink);transform:none;box-shadow:none}
.queue-actions button[data-queue-action=drop]:hover:not(:disabled){color:var(--danger)}
.queue-actions button svg{width:0.9375rem;height:0.9375rem}
.queue-edit{flex:1;min-width:0;display:flex;align-items:flex-end;gap:0.375rem}
.queue-edit textarea{flex:1;min-width:0;min-height:2.75rem;padding:0.5rem 0.625rem;border-radius:var(--radius);font-size:0.9375rem;line-height:1.6;background:var(--surface);resize:vertical}
.queue-edit button{width:2rem;height:2rem;padding:0.4375rem;border:0;border-radius:var(--radius-sm);background:var(--surface-3);color:var(--accent);box-shadow:none}
.queue-edit button:hover:not(:disabled){background:var(--hover);transform:none;box-shadow:none;color:var(--accent-hover)}
.queue-edit button svg{width:1rem;height:1rem}

/* Motion pass: nothing in the workspace should snap between states.
   Collapsible blocks grow and shrink, their triangle turns with the panel, modals rise in with the backdrop. */
:root{interpolate-size:allow-keywords}
details::details-content{block-size:0;opacity:0;overflow:hidden;transition:block-size 180ms var(--ease),opacity 150ms var(--ease),content-visibility 180ms allow-discrete}
details[open]::details-content{block-size:auto;opacity:1}
.step-details>summary,.other-actions>summary,.reading-history>summary,.artifact-sources>summary{display:flex;align-items:center;gap:0.4375rem;list-style:none}
.step-details>summary::-webkit-details-marker,.other-actions>summary::-webkit-details-marker,.reading-history>summary::-webkit-details-marker,.artifact-sources>summary::-webkit-details-marker{display:none}
.execution-record>summary::before,.step-details>summary::before,.other-actions>summary::before,.reading-history>summary::before,.artifact-sources>summary::before{content:"";flex:none;width:0;height:0;border-left:0.3125rem solid currentColor;border-top:0.28125rem solid transparent;border-bottom:0.28125rem solid transparent;transform-origin:32% 50%;transition:transform 180ms var(--ease)}
details[open]>summary::before{transform:rotate(90deg)}
dialog{transition:opacity 200ms var(--ease),transform 260ms var(--ease)}
dialog::backdrop{transition:background 260ms var(--ease)}
@starting-style{dialog[open]{opacity:0;transform:translateY(0.875rem) scale(.985)}dialog[open]::backdrop{background:rgb(32 33 36/0)}}
/* Studio swaps documents without a hard cut, and the sources panel eases its own re-renders. */
@keyframes panel-enter{from{opacity:0;transform:translateY(0.4375rem)}to{opacity:1;transform:none}}
.output-detail,.output-list{animation:panel-enter 240ms var(--ease)}

/* 每日论文订阅：左栏是筛选 + 新建 + 订阅列表，中栏是一条订阅的设置与运行记录。
   Both borrow the pieces every other view already uses — list rows, cards, fields — and add only
   what this view needs: the filter row, the state dot, the weekday chips and the fold triangles. */
.sub-filters{display:flex;flex-wrap:wrap;gap:0.375rem}
.sub-filters button{flex:1 1 auto;justify-content:center;min-width:0;padding:0.375rem 0.625rem;font-size:0.875rem;border:0;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted)}
.sub-filters button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.sub-filters button.active{background:var(--accent-soft);color:var(--accent)}
.sub-create{width:100%;justify-content:center}
.sub-empty{padding:2.25rem 0.625rem;text-align:center;color:var(--faint);font-size:0.90625rem;line-height:1.9}
/* A dot, not a badge: the row already carries two lines of text, so the state must read at a glance. */
.sub-dot{flex:none;width:0.5rem;height:0.5rem;margin-top:0.4375rem;border-radius:50%;background:var(--line)}
.sub-dot[data-state=active]{background:var(--green)}
.sub-dot[data-state=pending]{background:transparent;box-shadow:inset 0 0 0 2px var(--green)}
.sub-dot[data-state=paused]{background:var(--faint)}
.sub-dot[data-state=done]{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line)}
.sub-name{width:100%;padding:0.375rem 0.5625rem;border:1px solid transparent;border-radius:var(--radius);background:transparent;font-size:1.09375rem;font-weight:500;color:var(--ink)}
.sub-name:hover,.sub-name:focus{background:var(--hover)}
.sub-name:focus{border-color:var(--line-soft)}
/* 时间与频道：原来每个字段各占一整行，窄栏里连「08:00」都被拉成一整条，右边看起来像一张被撑开的
   表单，和左边紧凑的列表完全两个气质。改成自适应网格——栏窄两列、栏更宽就三列，控件跟着格子收窄；
   频道从四行竖排改成一行可换行的勾选，整张卡的高度掉一半。 */
.sub-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.875rem,1fr));gap:0.875rem;align-items:start}
.sub-fields .dialog-field{margin-top:0;min-width:0}
.sub-fields .sub-wide{grid-column:1/-1}
.sub-weekdays{display:flex;flex-wrap:wrap;gap:0.375rem}
.sub-day{flex:0 0 auto;justify-content:center;min-width:2.5rem;padding:0.375rem 0.625rem;border:0;border-radius:var(--radius-sm);background:var(--surface-2);box-shadow:none;font-size:0.84375rem;color:var(--ink)}
.sub-day:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.sub-day.active{background:var(--accent-soft);color:var(--accent)}
.sub-channels{display:flex;flex-wrap:wrap;gap:0.5rem 1.25rem}
.sub-fold>summary{display:flex;align-items:center;gap:0.375rem;font-size:0.875rem;color:var(--muted);cursor:pointer;list-style:none;user-select:none;-webkit-user-select:none}
.sub-fold>summary::-webkit-details-marker{display:none}
.sub-fold>summary::before{content:"";flex:none;width:0;height:0;border-left:0.3125rem solid currentColor;border-top:0.28125rem solid transparent;border-bottom:0.28125rem solid transparent;transform-origin:32% 50%;transition:transform 180ms var(--ease)}
.sub-fold[open]>summary::before{transform:rotate(90deg)}
.sub-run{display:flex;flex-direction:column;gap:0.4375rem;padding:0.6875rem 0;border-top:1px solid var(--line-soft)}
.sub-run-headline{display:flex;align-items:center;justify-content:space-between;gap:0.625rem;font-size:0.875rem}
.sub-run-headline .dialog-chip{flex:none;height:1.875rem;padding:0 0.6875rem;font-size:0.8125rem}
.sub-run-meta{font-size:0.84375rem;line-height:1.7;color:var(--muted)}
.sub-note{font-size:0.84375rem;line-height:1.8;color:var(--faint)}
/* 一次性订阅错过执行时刻：红点和「已暂停」的灰点要能一眼分开，因为它还需要人来处理。 */
.sub-dot[data-state=missed]{background:var(--danger)}
/* 候选确认：运行记录展开后是这一轮真正取回的论文与三个动作；未接入的频道就地置灰说明。 */
.sub-channel-note{margin-left:0.375rem;font-size:0.78125rem;color:var(--faint)}
.sub-candidates-fold{margin-left:2px;margin-top:2px}
.sub-candidates{display:flex;flex-direction:column;gap:0.75rem;padding-top:0.625rem}
.sub-candidate{display:flex;flex-direction:column;gap:0.375rem;padding:0.75rem 0.875rem;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--surface-2)}
.sub-candidate-head{font-size:0.9375rem;line-height:1.5;color:var(--ink)}
.sub-candidate-head a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.sub-candidate-head a:hover{text-decoration-color:currentColor}
.sub-candidate-meta{font-size:0.8125rem;line-height:1.6;color:var(--faint)}
.sub-candidate-reason{font-size:0.875rem;line-height:1.7;color:var(--muted)}
.sub-candidate-summary{font-size:0.84375rem;line-height:1.7;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sub-choice-row{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:2px}
.sub-choice.active{background:var(--accent-soft);color:var(--accent)}
.sub-candidate-done{display:flex;align-items:center;gap:0.375rem;color:var(--green)}
.sub-candidate-done svg{width:0.9375rem;height:0.9375rem}

/* 我的论文：左栏列表 + 新建论文，中栏嵌入 AI 对话，右栏论文内容，版本与来源折叠在内容下方。
   The fold host sits after the content body so it never fights the writing editor for the column. */
.studio-create{width:100%;justify-content:center}
#studio-meta{flex:none;padding:0 1rem 0.875rem}
#studio-meta:empty{display:none}
.studio-meta-body{display:flex;flex-direction:column;gap:0.75rem;padding-top:0.625rem}

/* 笔记：中栏只留标题 + 正文，正文撑满剩余高度；导入/分享等折叠在下方。
   正文是这一栏唯一的写作面，所以它不带灰底，和面板同色，只靠位置和占位文字说明它是输入区。 */
.skill-title{width:100%;padding:0.375rem 0.5625rem;border:1px solid transparent;border-radius:var(--radius);background:transparent;font-size:1.25rem;font-weight:600;color:var(--ink)}
.skill-title:hover,.skill-title:focus{background:var(--hover)}
.skill-title:focus{border-color:var(--line-soft)}
.skill-body{flex:1;display:flex;min-height:15rem}
.skill-body textarea{flex:1;resize:none;line-height:1.8;background:var(--surface);border-color:transparent}
@media(prefers-reduced-motion:reduce){.sub-day:hover:not(:disabled),.sub-run-headline .dialog-chip:hover:not(:disabled){transform:none}}

/* 项目记忆：日报正文是这一屏真正要读的东西，所以它和对话正文同级；卡片标题、日期行、
   说明文字与选择器再各上一级，整屏不再出现比正文小两号的字。
   视图靠内容自证身份（本日记录里有 .memory-editor，项目记忆里有 .day-list）——
   两个栏是各个视图共用的宿主，用类名标记会在切换视图后留下过期的样式。 */
#chat-body:has(.memory-editor) :is(.dialog-field,.dialog-note,.dialog-status,.dialog-pre,.select-display,.select-options button),
#source-body:has(.day-list) :is(.dialog-note,.dialog-check),
#source-body:has(.day-list) .memory-settings>summary{font-size:0.9375rem}
#chat-body:has(.memory-editor) :is(.dialog-note,.dialog-status){line-height:1.8}
#chat-body:has(.memory-editor) :is(.memory-settings,.memory-record)>summary,
#chat-body:has(.memory-editor) .memory-proposal-body h4{font-size:0.9375rem}
#chat-body:has(.memory-editor) .badge,#source-body:has(.day-list) .badge{font-size:0.875rem}
#chat-body:has(.memory-editor) .memory-text{font-size:1rem;line-height:1.8;padding:0.875rem 1rem}
/* 版本与 AI 修订原本各占 45rem 满宽 —— 一根 2.125rem 高的灰条、一根 2.75rem 高的灰条，夹在大块
   正文之间最难看。版本收成按内容宽度的小下拉，修订要求与它的按钮并排，两根细长条一起消失。 */
#chat-body:has(.memory-editor) .memory-version{display:flex;align-items:center;gap:0.625rem;font-size:0.9375rem;line-height:1.6;color:var(--muted)}
#chat-body:has(.memory-editor) .memory-version .select-box{flex:0 0 auto;min-width:6rem}
#chat-body:has(.memory-editor) .memory-revise{display:flex;align-items:flex-end;gap:0.625rem}
#chat-body:has(.memory-editor) .memory-revise .dialog-field{flex:1;min-width:0;margin-top:0}
#chat-body:has(.memory-editor) .memory-revise>button{flex:none;height:2.75rem}
#chat-body:has(.memory-editor) .memory-head{gap:0.5625rem;padding:0.75rem 1rem;font-size:1rem}
#chat-body:has(.memory-editor) .memory-head svg{width:1.125rem;height:1.125rem}
#chat-body:has(.memory-editor) .memory-items{gap:0.5625rem;padding:0.875rem 1rem;font-size:1rem;line-height:1.85}
#chat-body:has(.memory-editor) .memory-items li{overflow-wrap:anywhere}
/* 本日记录：正文原本从栏的左边缘一直铺到右边缘，栏一宽一行就长得读不下去。
   这里把内容收成一条居中的阅读列 —— 左右留白随栏宽一起长，栏窄时保底 1.5rem。 */
#chat-body:has(.memory-editor){padding-inline:max(1.5rem,calc((100% - 45rem)/2))}

/* 论文订阅：和「本日记录」同一套处理 —— 中栏收成居中的阅读列，卡片正文、字段标签、选择器
   与运行记录各上一级，左栏订阅列表的两行小字也跟着提一级。
   视图身份取自左栏的筛选行：中栏在没选订阅时只剩一句话，靠它才拿得到同样的留白。 */
.panels:has(.sub-filters) #chat-body{padding-inline:max(1.5rem,calc((100% - 45rem)/2))}
.panels:has(.sub-filters) #chat-body :is(.dialog-field,.dialog-check,.dialog-status,.sub-note,.sub-run-meta,.select-display,.select-options button){font-size:0.9375rem}
.panels:has(.sub-filters) #chat-body :is(.dialog-status,.sub-note,.sub-run-meta,.sub-candidate-meta,.sub-candidate-reason,.sub-candidate-summary){line-height:1.75}
.panels:has(.sub-filters) #chat-body :is(.sub-run-headline,.sub-fold>summary,.sub-candidate-head){font-size:0.9375rem}
.panels:has(.sub-filters) #chat-body .memory-head{gap:0.5625rem;padding:0.75rem 1rem;font-size:1rem}
.panels:has(.sub-filters) #chat-body .memory-head svg{width:1.125rem;height:1.125rem}
.panels:has(.sub-filters) #chat-body .badge{font-size:0.875rem}
.panels:has(.sub-filters) #chat-body .memory-proposal-body{padding:0.875rem 1rem}
.panels:has(.sub-filters) #chat-body .sub-name{font-size:1.15625rem}
.panels:has(.sub-filters) #chat-body .sub-day{font-size:0.9375rem;min-width:2.75rem;padding:0.4375rem 0.75rem}
.panels:has(.sub-filters) #chat-body .sub-run-headline .dialog-chip{height:2rem;font-size:0.875rem}

/* Keep the same panel nodes and drafts; only the selected column is visible. */
@container app (max-width:67.5rem){
  .workspace{min-width:0;min-height:0}
  .workspace .app-header{padding-inline:0.5rem}
  .workspace-brand{flex:1}.project-title{max-width:none;min-width:0}
  .panel-tabs{position:relative;display:flex;flex:none;border-bottom:1px solid var(--line-soft)}
  .panel-tabs button{position:relative;flex:1;min-width:0;min-height:2.75rem;padding:0.5rem 0.25rem;border:0;border-radius:0;background:transparent;font-size:0.875rem;color:var(--muted)}
  .panel-tabs button[aria-selected=true]{color:var(--accent)}
  .panel-tabs-indicator{position:absolute;left:0;bottom:0;width:1px;height:2px;background:var(--accent);pointer-events:none;transform-origin:top left}
  .panels{display:flex;border-top:0;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
  .panels>.panel{display:none;flex:1;min-height:0}
  .panels>.panel.panel-active{display:flex}
  .panel-resizer,.panel-toggle,.panel-rail{display:none!important}
  .panel-head .panel-title{flex:1}
  .meta-list b{max-width:65%;overflow-wrap:anywhere}
  .panels pre{white-space:pre-wrap;overflow-wrap:anywhere}
  .skills-columns{grid-template-columns:minmax(0,1fr)}
  .settings-fields label{flex-wrap:wrap;gap:0.5rem}
}
@container app (max-width:37.5rem){
  .shell{padding-right:0.25rem}
  .shell-nav{width:3rem;padding:0.25rem 2px}
  .shell-nav-indicator{left:2px}

  .shell-nav button>span:not(.badge){display:none}
  .workspace-foot{height:0.5rem}
  .workspace-brand{min-width:0;gap:0.375rem}.workspace-brand .brandmark{display:none}
  .workspace-actions{gap:0.25rem}.workspace-create span,.workspace-share,.workspace-avatar{display:none!important}
  .workspace-create{width:2.25rem;min-width:2.25rem;padding:0.5rem}
  .chat-body{padding:0.75rem}.welcome h1{font-size:1.25rem}
  .panel-head{padding-inline:0.625rem}
  .panel-head h2{font-size:0.875rem}
  .panels:has(.sub-filters) #chat-body{padding-inline:0.75rem}

/* One background-based hover language, including text actions and disclosure triggers. */
summary,a[href],[role=button],.writing-upload,.dialog-check,.writing-check{border-radius:var(--radius-sm);transition:background-color 160ms var(--ease),color 160ms var(--ease)}
:is(summary,a[href],[role=button],.writing-upload,.dialog-check,.writing-check,label:has(input[type=checkbox])):not([aria-disabled=true]):not(:has(input:disabled)):hover{background:var(--hover)}
:is(button,a[href],summary):is(.active,[aria-selected=true],[aria-pressed=true],[aria-current=page]):not(:disabled):hover{background:var(--hover-selected);color:var(--accent-hover)}
:is(input,textarea,select):where(:not(:disabled):not([type=checkbox]):not([type=file])):hover{background:var(--hover)}
:is(.chat-search,.search-field,.composer):hover{background:var(--hover)}
:is(.chat-search,.search-field,.composer):hover :is(input,textarea){background:transparent}
.panel-resizer:hover{background:var(--hover)}

/* Keyboard focus is visible; pointer clicks do not add a permanent ring. */
:is(button,input,textarea,select,a,summary,[tabindex],[contenteditable]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:is(.composer,.chat-search,.search-field):has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
:is(.composer,.chat-search,.search-field) :is(input,textarea):focus-visible{outline:none}
.writing-upload:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.workbench-head{position:sticky;top:-0.375rem;z-index:1;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:2px 0.375rem}

.workbench-head>span{color:var(--muted);font-size:0.75rem;margin-left:auto}.workbench-group h3{font-size:0.75rem;color:var(--muted);font-weight:500;margin:0.75rem 0.625rem 0.25rem}.workbench-card{display:flex;align-items:flex-start;gap:0.75rem;width:100%;padding:0.75rem 0.625rem;border:0;border-radius:0.5rem;background:transparent;text-align:left;color:var(--ink)}.workbench-card:hover{background:var(--surface-2)}.workbench-card>svg{flex:none;width:1.125rem;height:1.125rem;color:var(--accent);margin-top:2px}.workbench-card>svg:last-child{width:0.875rem;height:0.875rem;color:var(--muted);align-self:center;margin-left:auto}.workbench-copy{display:flex;flex-direction:column;gap:0.1875rem;min-width:0}.workbench-copy strong{font-size:0.875rem;font-weight:600}.workbench-copy>span{font-size:0.8125rem;color:var(--muted);line-height:1.5}.workbench-copy small{font-size:0.6875rem;color:var(--muted);line-height:1.6}.workbench-intro{font-size:0.8125rem;color:var(--muted);margin:0.75rem}

@container app (max-width:32.5rem){.composer-tools{gap:0.25rem 0.5rem}.workbench-trigger{min-height:2.25rem}}
/* Small, fixed status slots keep conversation titles still during state changes. */
.task-marker{display:inline-grid;place-items:center;width:0.875rem;height:0.875rem;flex:none;color:var(--muted)}
.task-marker::before{content:"";width:0.5rem;height:0.5rem;border-radius:50%;background:currentColor}
.task-marker[data-state=idle]::before{visibility:hidden}
.task-marker:is([data-state=running],[data-state=routing])::before{width:0.6875rem;height:0.6875rem;background:none;border:1.5px solid var(--line);border-top-color:var(--muted);animation:status-spin 1.2s linear infinite}
.task-marker[data-state=succeeded]{color:var(--blue)}
.task-marker[data-state=succeeded]::before{transition:opacity 180ms var(--ease)}

.task-marker[data-state=waiting]::before{content:"Ⅱ";width:auto;height:auto;background:none;font-size:0.75rem;font-weight:600;color:var(--warning)}
.task-marker:is([data-state=failed],[data-state=interrupted])::before{content:"!";width:auto;height:auto;background:none;font-weight:600;color:var(--danger)}
.task-marker[data-state=stopped]::before{border-radius:2px}

.answer-copy svg{width:0.875rem;height:0.875rem}

.conversation-row,.library-row.card,.paper-row{transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease)}
/* Short, local transitions; native popover keeps its focus and dismissal behavior. */
@keyframes workbench-enter{from{opacity:0;transform:translateY(0.25rem)}to{opacity:1;transform:none}}
#paper-detail .reader-switch{animation:none}
